<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به پنل مدیریت | کانون مهر گلستان و دکتر حزینی</title>
  <link rel="icon" href="../assets/images/cropped-logo-1-32x32.png" sizes="32x32">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page-body">

  <div class="login-card">
    <img src="../assets/images/cropped-logo-1-180x180.png" alt="لوگو کانون مهر گلستان" class="login-logo">
    <h1 class="login-title">پنل مدیریت وب‌سایت</h1>
    <p class="login-subtitle">پورتال دکتر حزینی و کانون حامیان بیماران سرطانی مهر گلستان</p>

    <form id="login-form">
      <div class="form-group" style="text-align: right; margin-bottom: 16px;">
        <label class="form-label" for="username">نام کاربری</label>
        <div style="position: relative;">
          <input type="text" id="username" class="form-input" placeholder="نام کاربری را وارد نمایید..." required value="admin" style="width: 100%; padding-left: 12px; padding-right: 40px;">
          <i class="fa-solid fa-user" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #94A3B8;"></i>
        </div>
      </div>

      <div class="form-group" style="text-align: right; margin-bottom: 20px;">
        <label class="form-label" for="password">رمز عبور</label>
        <div style="position: relative;">
          <input type="password" id="password" class="form-input" placeholder="رمز عبور را وارد فرمایید..." required style="width: 100%; padding-left: 40px; padding-right: 40px;">
          <i class="fa-solid fa-lock" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #94A3B8;"></i>
          <button type="button" id="toggle-pass" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94A3B8; cursor: pointer;">
            <i class="fa-solid fa-eye" id="eye-icon"></i>
          </button>
        </div>
        <small style="color: #64748B; font-size: 0.75rem; margin-top: 6px; display: block;">
          حساب پیش‌فرض سیستم: نام‌کاربری <code style="background: #E2E8F0; padding: 2px 6px; border-radius: 4px; font-weight: bold;">admin</code> | رمز <code style="background: #E2E8F0; padding: 2px 6px; border-radius: 4px; font-weight: bold;">admin</code>
        </small>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; font-size: 0.85rem;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #475569;">
          <input type="checkbox" id="remember-me" checked style="accent-color: var(--primary);">
          مرا به خاطر بسپار
        </label>
        <a href="../index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">
          <i class="fa-solid fa-arrow-left"></i> بازگشت به سایت
        </a>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width: 100%;">
        <i class="fa-solid fa-right-to-bracket"></i> ورود به داشبورد مدیریت
      </button>

      <div id="login-error" style="display: none; margin-top: 18px; padding: 10px; border-radius: 8px; background: #FEE2E2; color: #DC2626; font-size: 0.85rem; font-weight: 600;">
        <i class="fa-solid fa-circle-exclamation"></i> <span id="error-text">رمز عبور نادرست است.</span>
      </div>
    </form>
  </div>

  <script>
    // Check if already logged in
    const existingToken = localStorage.getItem('hazini_admin_token') || sessionStorage.getItem('hazini_admin_token');
    if (existingToken) {
      window.location.href = 'index.html';
    }

    // Toggle password visibility
    const userInput = document.getElementById('username');
    const passInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-pass');
    const eyeIcon = document.getElementById('eye-icon');

    toggleBtn.addEventListener('click', () => {
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.className = 'fa-solid fa-eye-slash';
      } else {
        passInput.type = 'password';
        eyeIcon.className = 'fa-solid fa-eye';
      }
    });

    // Form Submission
    const loginForm = document.getElementById('login-form');
    const errorBox = document.getElementById('login-error');
    const errorText = document.getElementById('error-text');
    const submitBtn = document.getElementById('submit-btn');

    function showError(msg) {
      errorText.textContent = msg;
      errorBox.style.display = 'block';
    }

    function setAuthAndRedirect(token, userObj, remember) {
      const storage = remember ? localStorage : sessionStorage;
      storage.setItem('hazini_admin_token', token);
      if (userObj) {
        storage.setItem('hazini_current_user', JSON.stringify(userObj));
      }
      window.location.href = 'index.html';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال بررسی...';

      const username = userInput.value.trim();
      const password = passInput.value.trim();
      const remember = document.getElementById('remember-me').checked;
      const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

      try {
        // If running locally with Node.js backend
        if (isLocalHost) {
          try {
            const res = await fetch('/api/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username, password })
            });

            const contentType = res.headers.get('content-type') || '';
            if (contentType.includes('application/json')) {
              const data = await res.json();
              if (res.ok && data.success) {
                setAuthAndRedirect(data.token || ('admin_session_' + username), data.user, remember);
                return;
              } else {
                showError(data.message || 'نام کاربری یا رمز عبور اشتباه است.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> ورود به داشبورد مدیریت';
                return;
              }
            }
          } catch (netErr) {
            console.log('Local backend unreachable, trying local credentials...');
          }
        }

        // Static mode (GitHub Pages) or local storage credentials check
        let users = [];
        const savedUsers = localStorage.getItem('hazini_admin_users');
        if (savedUsers) {
          try { users = JSON.parse(savedUsers); } catch(e) {}
        }
        
        // Default users if not set
        if (!users || users.length === 0) {
          users = [
            { id: 1, username: 'admin', name: 'مدیر اصلی سیستم', role: 'مدیر کل', password: 'admin' }
          ];
          localStorage.setItem('hazini_admin_users', JSON.stringify(users));
        }

        // Check if matching user exists
        const matchedUser = users.find(u => u.username.toLowerCase() === username.toLowerCase() && u.password === password);
        
        if (matchedUser) {
          const token = 'admin_session_' + matchedUser.username + '_' + Date.now();
          const userSafe = { id: matchedUser.id, username: matchedUser.username, name: matchedUser.name, role: matchedUser.role };
          setAuthAndRedirect(token, userSafe, remember);
          return;
        } else {
          showError('نام کاربری یا رمز عبور اشتباه است.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> ورود به داشبورد مدیریت';
        }
      } catch (err) {
        console.error('Login error:', err);
        showError('خطا در فرآیند ورود. لطفاً دوباره تلاش کنید.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> ورود به داشبورد مدیریت';
      }
    });
  </script>
</body>
</html>
