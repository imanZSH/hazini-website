<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به پنل مدیریت | کانون مهر گلستان و دکتر حزینی</title>
  <link rel="icon" href="../assets/images/cropped-logo-1-32x32.png" sizes="32x32">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page-body">

  <div class="login-card">
    <img src="../assets/images/logo.png" alt="لوگو کانون مهر گلستان" class="login-logo" onerror="this.src='../assets/images/logo-1-300x280.png'">
    <h1 class="login-title">پنل مدیریت وب‌سایت</h1>
    <p class="login-subtitle">پورتال دکتر حزینی و کانون حامیان بیماران سرطانی مهر گلستان</p>

    <form id="login-form">
      <div class="form-group" style="text-align: right; margin-bottom: 20px;">
        <label class="form-label" for="password">رمز عبور مدیریت</label>
        <div style="position: relative;">
          <input type="password" id="password" class="form-input" placeholder="رمز عبور را وارد فرمایید..." required style="width: 100%; padding-left: 40px;">
          <button type="button" id="toggle-pass" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94A3B8; cursor: pointer;">
            <i class="fa-solid fa-eye" id="eye-icon"></i>
          </button>
        </div>
        <small style="color: #64748B; font-size: 0.75rem; margin-top: 4px; display: block;">
          رمز پیش‌فرض سیستم: <code style="background: #E2E8F0; padding: 2px 6px; border-radius: 4px; font-weight: bold;">admin</code>
        </small>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; font-size: 0.85rem;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #475569;">
          <input type="checkbox" id="remember-me" checked style="accent-color: var(--primary);">
          مرا به خاطر بسپار
        </label>
        <a href="../index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">
          <i class="fa-solid fa-arrow-left"></i> بازگشت به سایت
        </a>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width: 100%;">
        <i class="fa-solid fa-right-to-bracket"></i> ورود به داشبورد مدیریت
      </button>

      <div id="login-error" style="display: none; margin-top: 18px; padding: 10px; border-radius: 8px; background: #FEE2E2; color: #DC2626; font-size: 0.85rem; font-weight: 600;">
        <i class="fa-solid fa-circle-exclamation"></i> <span id="error-text">رمز عبور نادرست است.</span>
      </div>
    </form>
  </div>

  <script>
    // Check if already logged in
    const existingToken = localStorage.getItem('hazini_admin_token') || sessionStorage.getItem('hazini_admin_token');
    if (existingToken) {
      window.location.href = 'index.html';
    }

    // Toggle password visibility
    const passInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-pass');
    const eyeIcon = document.getElementById('eye-icon');

    toggleBtn.addEventListener('click', () => {
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.className = 'fa-solid fa-eye-slash';
      } else {
        passInput.type = 'password';
        eyeIcon.className = 'fa-solid fa-eye';
      }
    });

    // Form Submission (Hybrid Adapter: Try Server API, fallback to client-side localStorage check for GitHub Pages)
    const loginForm = document.getElementById('login-form');
    const errorBox = document.getElementById('login-error');
    const errorText = document.getElementById('error-text');
    const submitBtn = document.getElementById('submit-btn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال بررسی...';

      const password = passInput.value.trim();
      const remember = document.getElementById('remember-me').checked;

      try {
        // 1. Try Server API first (when running on Express backend)
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const contentType = res.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
          if (res.ok) {
            const data = await res.json();
            const token = data.token || ('admin_session_' + password);
            if (remember) {
              localStorage.setItem('hazini_admin_token', token);
            } else {
              sessionStorage.setItem('hazini_admin_token', token);
            }
            window.location.href = 'index.html';
            return;
          } else if (res.status === 401) {
            const errData = await res.json().catch(() => ({}));
            showError(errData.message || 'رمز عبور اشتباه است.');
            return;
          }
        }
      } catch (networkErr) {
        // Network error / server offline
      }

      // 2. Static hosting fallback (GitHub Pages)
      console.log('Server not reachable or running in static mode (GitHub Pages compatible).');
      const customPass = localStorage.getItem('hazini_custom_admin_password') || 'admin';
      
      if (password === customPass || password === 'admin') {
        const token = 'admin_session_' + password;
        if (remember) {
          localStorage.setItem('hazini_admin_token', token);
        } else {
          sessionStorage.setItem('hazini_admin_token', token);
        }
        window.location.href = 'index.html';
        return;
      } else {
        showError('رمز عبور اشتباه است.');
      }
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> ورود به داشبورد مدیریت';
    }
  });

    function showError(msg) {
      errorText.textContent = msg;
      errorBox.style.display = 'block';
    }
  </script>
</body>
</html>
